<!DOCTYPE html>
<html lang="ml" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Programs — EID-E IRSHAD 2K26</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        .prog-cat-tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .prog-tab-btn { background: var(--card-bg); border: 2px solid var(--border-color); color: var(--text-color); padding: 8px 16px; border-radius: 25px; font-weight: 800; font-size: 0.85rem; cursor: pointer; font-family: 'Montserrat', 'Anek Malayalam', sans-serif; }
        .prog-tab-btn.active, .prog-tab-btn:hover { border-color: var(--accent-gold); background: var(--accent-gold); color: #0f172a; }
        
        .prog-section-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-md); }
        .prog-section-title { font-size: 1.05rem; font-weight: 900; margin: 0 0 12px; color: var(--accent-gold); display: flex; align-items: center; justify-content: space-between; }
        
        .prog-items-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .prog-pill-badge { background: var(--bg-color); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .prog-pill-badge button { background: none; border: none; color: #dc2626; font-weight: 900; cursor: pointer; font-size: 0.9rem; padding: 0; }
        
        .prog-add-row { display: flex; gap: 8px; margin-top: 10px; }
        .prog-add-row input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 0.88rem; }
        .prog-add-btn { background: #059669; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <div id="adminBar" class="admin-bar">
        <span>⚙️ Admin Mode Active (Programs Manager)</span>
        <div class="admin-actions">
            <button class="btn-backup" onclick="resetDefaultProgramsList()" style="background:#fbbf24; color:#0f172a; font-weight:900;">🔄 Reset Defaults</button>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
        </div>
    </div>

    <div class="top-nav-bar">
        <button class="back-home-btn" onclick="location.href='index.html'">⬅️ Back</button>
        <span class="nav-page-title">📝 MANAGE FESTIVAL PROGRAMS</span>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">🌙 Dark</button>
    </div>

    <div class="container" style="max-width: 900px; margin: 25px auto;">
        <h1 class="page-title">മത്സര ഇനങ്ങളും പ്രോഗ്രാമുകളും</h1>
        <p class="page-subtitle">വിവിധ വിഭാഗങ്ങളിലായി നടക്കുന്ന സ്റ്റേജ്, ഓഫ്-സ്റ്റേജ്, സ്പോർട്സ് മത്സരങ്ങൾ നിയന്ത്രിക്കാം</p>

        <!-- Category Tabs -->
        <div class="prog-cat-tabs">
            <button class="prog-tab-btn active" onclick="switchProgramTab('senior', this)">🎓 Senior</button>
            <button class="prog-tab-btn" onclick="switchProgramTab('junior', this)">📘 Junior</button>
            <button class="prog-tab-btn" onclick="switchProgramTab('subjunior', this)">🌱 Sub Junior</button>
            <button class="prog-tab-btn" onclick="switchProgramTab('general', this)">🌟 General</button>
        </div>

        <!-- Sections Container -->
        <div id="programsManagerContainer"></div>
    </div>

    <footer>&copy; 2026 EID-E IRSHAD &bull; IRSHADUNNASIHEEN SAHITHYA SAMAJAM</footer>
    <script src="app.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                switchProgramTab('senior');
            }, 300);
        });

        function switchProgramTab(catKey, btnEl) {
            currentProgramCat = catKey;
            if (btnEl) {
                document.querySelectorAll(".prog-tab-btn").forEach(b => b.classList.remove("active"));
                btnEl.classList.add("active");
            }
            renderProgramsManager();
        }

        function renderProgramsManager() {
            const container = document.getElementById("programsManagerContainer");
            if (!container) return;

            const progs = normalizeProgramsData(appData.programs);
            const catObj = progs[currentProgramCat] || { onStage: [], offStage: [], sports: [] };

            const sections = [
                { key: "onStage", title: "🎭 സ്റ്റേജ് മത്സരങ്ങൾ (On-Stage)" },
                { key: "offStage", title: "🎨 ഓഫ്-സ്റ്റേജ് മത്സരങ്ങൾ (Off-Stage)" },
                { key: "sports", title: "⚽ സ്പോർട്സ് മത്സരങ്ങൾ (Sports)" }
            ];

            let html = "";
            sections.forEach(sec => {
                const list = catObj[sec.key] || [];
                let pillsHtml = "";
                list.forEach((pName, idx) => {
                    const safeCat = currentProgramCat;
                    const safeSec = sec.key;
                    pillsHtml += `
                        <div class="prog-pill-badge">
                            <span>${pName}</span>
                            ${isAdmin ? `<button onclick="removeProgramItem('${safeCat}', '${safeSec}',${idx})" title="Delete">&times;</button>` : ""}
                        </div>
                    `;
                });

                if (pillsHtml === "") {
                    pillsHtml = `<div style="color:var(--text-muted); font-size:0.8rem; font-style:italic;">ഇതുവരെ പ്രോഗ്രാമുകൾ ചേർത്തിട്ടില്ല.</div>`;
                }

                html += `
                    <div class="prog-section-card">
                        <h3 class="prog-section-title">${sec.title} <span style="font-size:0.75rem; background:var(--bg-color); padding:3px 8px; border-radius:10px; border:1px solid var(--border-color);">${list.length} Programs</span></h3>
                        <div class="prog-items-grid">${pillsHtml}</div>
                        ${isAdmin ? `
                            <div class="prog-add-row">
                                <input type="text" id="input_${currentProgramCat}_${sec.key}" placeholder="പുതിയ പ്രോഗ്രാമിന്റെ പേര് ടൈപ്പ് ചെയ്യുക...">
                                <button class="prog-add-btn" onclick="addNewProgramItem('${currentProgramCat}', '${sec.key}')">➕ ചേർക്കുക</button>
                            </div>
                        ` : ""}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function addNewProgramItem(catKey, secKey) {
            if (!isAdmin) { alert("അഡ്മിൻ അനുമതി ആവശ്യമാണ്!"); return; }
            const input = document.getElementById(`input_${catKey}_${secKey}`);
            if (!input || !input.value.trim()) { alert("പ്രോഗ്രാമിന്റെ പേര് നൽകുക!"); return; }
            const val = input.value.trim();

            let cloned = JSON.parse(JSON.stringify(appData));
            if (!cloned.programs) cloned.programs = normalizeProgramsData(defaultData.programs);
            if (!cloned.programs[catKey]) cloned.programs[catKey] = { onStage: [], offStage: [], sports: [] };
            if (!Array.isArray(cloned.programs[catKey][secKey])) cloned.programs[catKey][secKey] = [];

            if (!cloned.programs[catKey][secKey].includes(val)) {
                cloned.programs[catKey][secKey].push(val);
                saveAppData(false, cloned, () => {
                    input.value = "";
                    renderProgramsManager();
                });
            } else {
                alert("ഈ പ്രോഗ്രാം ഇതിനകം പട്ടികയിലുണ്ട്!");
            }
        }

        function removeProgramItem(catKey, secKey, index) {
            if (!isAdmin) { alert("അഡ്മിൻ അനുമതി ആവശ്യമാണ്!"); return; }
            if (confirm("ഈ പ്രോഗ്രാം നീക്കം ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                let cloned = JSON.parse(JSON.stringify(appData));
                if (cloned.programs && cloned.programs[catKey] && cloned.programs[catKey][secKey]) {
                    cloned.programs[catKey][secKey].splice(index, 1);
                    saveAppData(false, cloned, () => {
                        renderProgramsManager();
                    });
                }
            }
        }

        function resetDefaultProgramsList() {
            if (!isAdmin) { alert("അഡ്മിൻ അനുമതി ആവശ്യമാണ്!"); return; }
            if (confirm("എല്ലാ പ്രോഗ്രാമുകളും ഡിഫോൾട്ട് ലിസ്റ്റിലേക്ക് റീസെറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                let cloned = JSON.parse(JSON.stringify(appData));
                cloned.programs = JSON.parse(JSON.stringify(defaultData.programs));
                saveAppData(false, cloned, () => {
                    alert("പ്രോഗ്രാം ലിസ്റ്റ് റീസെറ്റ് ചെയ്തു!");
                    renderProgramsManager();
                });
            }
        }
    </script>
</body>
</html>
