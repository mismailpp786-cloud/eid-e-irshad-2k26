        .cat-btn { padding: 8px 18px; border: 2px solid #3b82f6; background: #fff; color: #3b82f6; font-weight: 800; border-radius: 25px; cursor: pointer; font-size: 0.9rem; }

        .type-btn { padding: 7px 15px; border: 1px solid #cbd5e1; background: #f1f5f9; color: #475569; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }

        let editingIndex = null;

        function savePrograms() {
            localStorage.setItem("eid_programs_data", JSON.stringify(programsData));
            renderTable();
        }

        function updateAdminUI() {
            document.getElementById("adminBar").style.display = isAdmin ? "flex" : "none";
            document.getElementById("adminBtn").style.display = isAdmin ? "none" : "inline-block";
            document.getElementById("addProgBtn").style.display = isAdmin ? "inline-block" : "none";
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById("programTableBody");
            const title = document.getElementById("tableTitle");
            const offBtn = document.getElementById("offstageBtn");

            if (currentCat === "general") {
                offBtn.style.display = "none";
                if (currentTp === "offstage") currentTp = "onstage";
            } else {
                offBtn.style.display = "inline-block";
            }

            const catNames = { senior: "SENIOR", junior: "JUNIOR", subjunior: "SUB JUNIOR", general: "GENERAL" };
            const typeNames = { onstage: currentCat === "general" ? "GENERAL PROGRAMS" : "ON STAGE", offstage: "OFF STAGE", sports: "SPORTS" };
            title.textContent = `${catNames[currentCat]} — ${typeNames[currentTp]}`;

            const list = (programsData[currentCat] && programsData[currentCat][currentTp]) || [];
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:20px;">പ്രോഗ്രാമുകൾ ചേർത്തിട്ടില്ല.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map((item, idx) => `
                <tr>
                    <td><strong>${item.no}</strong></td>
                    <td>
                        <strong>${item.name}</strong>
                        ${isAdmin ? `<button class="edit-row-btn" onclick="openEditModal(${idx})">✏️ Edit</button>` : ""}
                    </td>
                    <td>${item.teamA || '<span style="color:#aaa;">-</span>'}</td>
                    <td>${item.teamB || '<span style="color:#aaa;">-</span>'}</td>
                </tr>
            `).join("");
        }

        function filterCategory(cat, btn) {
            currentCat = cat;
            document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderTable();
        }

        function filterType(tp, btn) {
            currentTp = tp;
            document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderTable();
        }

        /* ADMIN EDIT FUNCTIONS */
        function openEditModal(idx) {
            if (!isAdmin) return;
            editingIndex = idx;
            const item = programsData[currentCat][currentTp][idx];
            document.getElementById("editProgName").value = item.name;
            document.getElementById("editTeamAInput").value = item.teamA;
            document.getElementById("editTeamBInput").value = item.teamB;

            const getStudents = (tKey) => currentCat === "general"
                ? [...teamsData[tKey].senior, ...teamsData[tKey].junior, ...teamsData[tKey].subjunior]
                : (teamsData[tKey][currentCat] || []);

            document.getElementById("selectTeamA").innerHTML = `<option value="">-- ZELLIJ ലിസ്റ്റിൽ നിന്ന് തിരഞ്ഞെടുക്കുക --</option>` + getStudents("teamA").map(s => `<option value="${s}">${s}</option>`).join("");
            document.getElementById("selectTeamB").innerHTML = `<option value="">-- IZNIK ലിസ്റ്റിൽ നിന്ന് തിരഞ്ഞെടുക്കുക --</option>` + getStudents("teamB").map(s => `<option value="${s}">${s}</option>`).join("");
            document.getElementById("editModal").style.display = "flex";
        }

        function appendStudent(team) {
            const sel = document.getElementById("selectTeam" + team);
            const inp = document.getElementById("editTeam" + team + "Input");
            if (!sel.value) return;
            inp.value = inp.value.trim() ? inp.value + ", " + sel.value : sel.value;
            sel.value = "";
        }

        function closeEditModal() {
            document.getElementById("editModal").style.display = "none";
        }

        function saveProgramChanges() {
            if (!isAdmin || editingIndex === null) return;
            const item = programsData[currentCat][currentTp][editingIndex];
            item.name = document.getElementById("editProgName").value.trim();
            item.teamA = document.getElementById("editTeamAInput").value.trim();
            item.teamB = document.getElementById("editTeamBInput").value.trim();
            closeEditModal();
            savePrograms();
        }

        function deleteCurrentProgram() {
            if (!isAdmin || editingIndex === null) return;
            if (!confirm("ഈ പ്രോഗ്രാം ലിസ്റ്റിൽ നിന്ന് ഒഴിവാക്കണോ?")) return;
            programsData[currentCat][currentTp].splice(editingIndex, 1);
            programsData[currentCat][currentTp].forEach((it, i) => it.no = String(i + 1).padStart(2, "0"));
            closeEditModal();
            savePrograms();
        }

        function addNewProgram() {
            if (!isAdmin) return;
            const name = prompt("പുതിയ പ്രോഗ്രാമിന്റെ പേര് നൽകുക:");
            if (!name || !name.trim()) return;
            const list = programsData[currentCat][currentTp];
            list.push({ no: String(list.length + 1).padStart(2, "0"), name: name.trim(), teamA: "", teamB: "" });
            savePrograms();
        }

        function resetProgramsData() {
            if (confirm("പ്രോഗ്രാം ലിസ്റ്റ് ആദ്യത്തെ നിലയിലേക്ക് പുനഃസ്ഥാപിക്കണോ?")) {
                programsData = JSON.parse(JSON.stringify(defaultPrograms));
                savePrograms();
            }
        }

        /* ADMIN AUTH */
        function openAdminModal() {
            document.getElementById("loginError").textContent = "";
            document.getElementById("adminPassword").value = "";
            document.getElementById("loginModal").style.display = "flex";
        }

        function closeAdminModal() {
            document.getElementById("loginModal").style.display = "none";
        }

        function loginAdmin() {
            const email = document.getElementById("adminEmail").value.trim().toLowerCase();
            const pass = document.getElementById("adminPassword").value.trim();
            if (email === "admin@irshad.com" && pass === "irshad2k26") {
                isAdmin = true;
                localStorage.setItem("eid_irshad_admin_logged", "true");
                closeAdminModal();
                updateAdminUI();
            } else {
                document.getElementById("loginError").textContent = "തെറ്റായ ഐഡിയോ പാസ്‌വേഡോ ആണ്!";
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            localStorage.removeItem("eid_irshad_admin_logged");
            updateAdminUI();
        }

        updateAdminUI();
    </script>
</body>
</html>
