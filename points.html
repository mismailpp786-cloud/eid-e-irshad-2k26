<!DOCTYPE html>
<html lang="ml" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Master Scoreboard — EID-E IRSHAD 2K26</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        .live-status-bar {
            background: #131c31;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }
        .live-pulse-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            animation: pulseLive 1.5s infinite;
        }
        @keyframes pulseLive {
            0% { transform: scale(0.95); opacity: 1; }
            70% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .tv-mode-btn {
            background: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            cursor: pointer;
        }

        /* Grand Total Score Banner */
        .broadcast-score-banner {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
            background: var(--card-bg);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
        }
        .team-score-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 8px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
        }
        .team-score-box.zellij-box { border-left: 4px solid #ef4444; }
        .team-score-box.iznik-box { border-left: 4px solid #3b82f6; }
        .team-badge-title { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 900; }
        .team-giant-pts { font-family: 'Montserrat', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--accent-gold); }
        .vs-circle {
            width: 30px; height: 30px; border-radius: 50%;
            background: var(--accent-gold); color: #0f172a;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.75rem;
            display: flex; align-items: center; justify-content: center;
        }

        /* Matrix Section Card */
        .matrix-section-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 10px;
        }
        .matrix-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
        }
        .matrix-section-title {
            font-size: 0.9rem;
            font-weight: 900;
            margin: 0;
            font-family: 'Montserrat', 'Anek Malayalam', sans-serif;
            color: var(--accent-gold);
        }
        .section-sub-score {
            display: flex;
            gap: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 900;
        }

        /* Table Layout */
        .matrix-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 6px;
        }
        .score-matrix-table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            min-width: 100%;
            background: var(--card-bg);
            font-size: 0.72rem;
        }
        .score-matrix-table th,
        .score-matrix-table td {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            vertical-align: middle;
        }
        .score-matrix-table th.sticky-col,
        .score-matrix-table td.sticky-col {
            position: sticky;
            left: 0;
            z-index: 5;
            background: var(--card-bg);
            border-right: 2px solid var(--accent-gold);
            min-width: 85px;
            max-width: 100px;
        }
        .score-matrix-table th.sticky-col {
            z-index: 6;
            background: var(--bg-color);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 0.65rem;
            padding: 4px 2px;
        }
        .score-matrix-table th.prog-vert-header {
            height: 95px;
            min-width: 32px;
            max-width: 40px;
            padding: 4px 1px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 1.05;
            white-space: nowrap;
            background: var(--bg-color);
            color: var(--text-color);
        }
        .group-tag-dot {
            display: inline-block; width: 4px; height: 4px; background: #f59e0b; border-radius: 50%; margin-top: 2px;
        }
        .score-matrix-table th.sec-total-header,
        .score-matrix-table th.sticky-right-col {
            height: 95px;
            min-width: 45px;
            padding: 4px 2px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 0.7rem;
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
        }
        .score-matrix-table th.sec-total-header { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        
        .score-matrix-table th.sticky-right-col,
        .score-matrix-table td.sticky-right-col {
            position: sticky;
            right: 0;
            z-index: 5;
            background: #0f172a;
            color: #fbbf24;
            border-left: 2px solid var(--accent-gold);
        }
        .score-matrix-table th.sticky-right-col { z-index: 6; }

        .score-matrix-table td.team-name-cell {
            font-weight: 900;
            font-size: 0.72rem;
            padding: 6px 4px;
            font-family: 'Montserrat', sans-serif;
            text-align: left;
            white-space: nowrap;
        }
        .score-matrix-table td.score-stack-cell {
            padding: 2px 1px;
            min-height: 42px;
            height: 42px;
            vertical-align: middle;
        }
        .score-matrix-table td.score-stack-cell.admin-clickable { cursor: pointer; }
        .score-matrix-table td.score-stack-cell.admin-clickable:hover { background: rgba(245, 158, 11, 0.15); }

        .score-pill-stack {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
        }
        .stacked-score-badge {
            display: inline-block; min-width: 18px; padding: 1px 3px; border-radius: 3px;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.65rem;
        }
        .badge-team-a { background: #ef4444; color: #ffffff; }
        .badge-team-b { background: #3b82f6; color: #ffffff; }
        .empty-dash { color: var(--text-muted); opacity: 0.3; font-size: 0.6rem; }

        .score-matrix-table td.sec-total-cell {
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.8rem; padding: 4px 2px; background: rgba(16, 185, 129, 0.06);
        }
        .score-matrix-table td.grand-total-cell {
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.9rem; padding: 4px 2px; background: #0f172a;
        }

        /* TV Fullscreen Mode */
        body.tv-live-mode .top-nav-bar,
        body.tv-live-mode footer,
        body.tv-live-mode .admin-only {
            display: none !important;
        }
        body.tv-live-mode .container {
            max-width: 99vw !important;
            margin: 4px auto !important;
        }
        body.tv-live-mode .matrix-section-card {
            padding: 6px;
            margin-bottom: 6px;
        }
        body.tv-live-mode .score-matrix-table th.prog-vert-header,
        body.tv-live-mode .score-matrix-table th.sec-total-header,
        body.tv-live-mode .score-matrix-table th.sticky-right-col {
            height: 75px;
        }
    </style>
</head>
<body>

    <div id="adminBar" class="admin-bar">
        <span>⚙️ Admin Mode Active</span>
        <div class="admin-actions">
            <button class="btn-backup" onclick="exportBackupJSON()">📥 Backup</button>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
        </div>
    </div>

    <div class="top-nav-bar">
        <button class="back-home-btn" onclick="location.href='index.html'">⬅️ Back</button>
        <span class="nav-page-title">📊 LIVE MASTER SCOREBOARD</span>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ Light</button>
    </div>

    <div class="container" style="max-width: 1200px; margin: 10px auto;">
        
        <!-- Live Status Bar -->
        <div class="live-status-bar">
            <div>
                <span class="live-pulse-dot"></span>
                <span style="font-weight: 800;">LIVE SCOREBOARD • EID-E IRSHAD 2K26</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="autoRefreshTimerText" style="font-size: 0.7rem; font-weight: 800; font-family: 'Montserrat', sans-serif;">🔄 30s</span>
                <button class="tv-mode-btn" onclick="toggleTvFullscreenMode()" id="tvModeBtn">📺 TV Mode</button>
            </div>
        </div>

        <!-- Grand Total Score Banner -->
        <div class="broadcast-score-banner">
            <div class="team-score-box zellij-box">
                <div>
                    <div class="team-badge-title" style="color: #f87171;">🔴 ZELLIJ</div>
                    <div style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted);" id="medalsA">🥇0 🥈0 🥉0</div>
                </div>
                <div class="team-giant-pts" id="bigPtsA">0</div>
            </div>

            <div class="vs-circle">VS</div>

            <div class="team-score-box iznik-box">
                <div>
                    <div class="team-badge-title" style="color: #60a5fa;">🔵 IZNIK</div>
                    <div style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted);" id="medalsB">🥇0 🥈0 🥉0</div>
                </div>
                <div class="team-giant-pts" id="bigPtsB">0</div>
            </div>
        </div>

        <!-- Admin Quick Controls -->
        <div class="card admin-only" data-display="block" style="border: 1px solid var(--accent-gold); margin-bottom: 8px; padding: 10px;">
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.78rem;">
                <select id="pointPresetSelect" class="form-control" style="max-width: 260px; padding: 4px;" onchange="changePointPreset(this.value)">
                    <option value="5-3-1">Rules (Single: 5,3,1 | Group: 10,6,3)</option>
                    <option value="10-5-3">Custom (All: 10,5,3)</option>
                </select>
                <label style="font-weight: 700;"><input type="checkbox" id="manualScoreToggle"> Override</label>
                <input type="number" id="manualPtsAInput" class="form-control" style="width: 70px; padding: 4px;" value="0">
                <input type="number" id="manualPtsBInput" class="form-control" style="width: 70px; padding: 4px;" value="0">
                <button class="btn-submit" style="background: #059669; color: #fff; margin: 0; width: auto; padding: 4px 10px;" onclick="saveManualScoreFromUI()">Save</button>
            </div>
        </div>

        <!-- Master Score Matrix Container (Rendered as 2 Main Boxes: ARTS & SPORTS) -->
        <div id="masterScoreMatrixContainer"></div>

    </div>

    <!-- Modal for Admin Cell Score Editing -->
    <div id="cellScoreModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCellScoreModal()">&times;</span>
            <h3 id="cellModalTitle" style="margin: 0 0 6px; font-weight: 900; color: var(--accent-gold);">Edit Marks</h3>
            <input type="hidden" id="editCellKey">
            <div class="form-group">
                <label style="color: var(--zellij-red);">🔴 Team A Marks:</label>
                <input type="text" id="editCellTeamA" class="form-control" placeholder="5, 1">
            </div>
            <div class="form-group">
                <label style="color: var(--iznik-blue);">🔵 Team B Marks:</label>
                <input type="text" id="editCellTeamB" class="form-control" placeholder="3">
            </div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button class="btn-submit" style="background: #059669; color: #fff; margin: 0; padding: 6px;" onclick="saveCellScoreModal()">Save</button>
                <button class="btn-submit" style="background: #dc2626; color: #fff; margin: 0; padding: 6px;" onclick="clearCellScoreModal()">Reset</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 EID-E IRSHAD &bull; IRSHADUNNASIHEEN SAHITHYA SAMAJAM
    </footer>

    <script src="app.js"></script>
    <script>
        // Override renderMasterScoreMatrix specifically for 2 Main Boxes: ARTS & SPORTS combining all categories (Senior, Junior, Sub Junior, General)
        function renderMasterScoreMatrix() {
            const container = document.getElementById("masterScoreMatrixContainer");
            if (!container) return;

            const progs = normalizeProgramsData(appData.programs);
            
            let artsPrograms = [];
            let sportsPrograms = [];

            ["senior", "junior", "subjunior", "general"].forEach(catKey => {
                const cObj = progs[catKey] || { onStage: [], offStage: [], sports: [] };
                const catShort = catKey.toUpperCase() === "SUBJUNIOR" ? "SUB" : catKey.toUpperCase().substring(0, 3);
                const prefix = `[${catShort}] `;
                
                (cObj.onStage || []).forEach(p => artsPrograms.push({ catKey, name: prefix + p, rawName: p }));
                (cObj.offStage || []).forEach(p => artsPrograms.push({ catKey, name: prefix + p, rawName: p }));
                (cObj.sports || []).forEach(p => sportsPrograms.push({ catKey, name: prefix + p, rawName: p }));
            });

            const renderMainBoxTable = (boxTitle, progItems) => {
                if (progItems.length === 0) return "";

                let secTotalA = 0;
                let secTotalB = 0;
                let headerColsHtml = "";
                let rowACellsHtml = "";
                let rowBCellsHtml = "";

                progItems.forEach(item => {
                    const isGrp = GROUP_EVENTS_LIST.includes(item.rawName);
                    const cellData = getProgramScoresForCell(item.catKey, item.rawName);
                    const sumA = cellData.teamA.reduce((a, b) => a + b, 0);
                    const sumB = cellData.teamB.reduce((a, b) => a + b, 0);
                    secTotalA += sumA;
                    secTotalB += sumB;

                    const stackAHtml = cellData.teamA.length > 0
                        ? `<div class="score-pill-stack">${cellData.teamA.map(n => `<span class="stacked-score-badge badge-team-a">${n}</span>`).join("")}</div>`
                        : `<span class="empty-dash">·</span>`;

                    const stackBHtml = cellData.teamB.length > 0
                        ? `<div class="score-pill-stack">${cellData.teamB.map(n => `<span class="stacked-score-badge badge-team-b">${n}</span>`).join("")}</div>`
                        : `<span class="empty-dash">·</span>`;

                    const safeCat = item.catKey.replace(/'/g, "\\'");
                    const safeProg = item.rawName.replace(/'/g, "\\'");
                    const clickAttr = isAdmin ? `onclick="openCellScoreModal('${safeCat}', '${safeProg}')"` : "";
                    const clickClass = isAdmin ? "admin-clickable" : "";

                    headerColsHtml += `<th class="prog-vert-header" title="${item.name}">${item.name}${isGrp ? ' <span class="group-tag-dot" title="Group"></span>' : ''}</th>`;
                    rowACellsHtml += `<td class="score-stack-cell ${clickClass}" ${clickAttr}>${stackAHtml}</td>`;
                    rowBCellsHtml += `<td class="score-stack-cell ${clickClass}" ${clickAttr}>${stackBHtml}</td>`;
                });

                return `
                    <div class="matrix-section-card">
                        <div class="matrix-section-header">
                            <h3 class="matrix-section-title">✨ ${boxTitle}</h3>
                            <div class="section-sub-score">
                                <span style="color:#ef4444;">🔴 ZELLIJ: ${secTotalA}</span>
                                <span style="color:#3b82f6;">🔵 IZNIK: ${secTotalB}</span>
                            </div>
                        </div>
                        <div class="matrix-scroll-wrapper">
                            <table class="score-matrix-table">
                                <thead>
                                    <tr>
                                        <th class="sticky-col">TEAMS</th>
                                        ${headerColsHtml}
                                        <th class="sec-total-header">TOTAL</th>
                                        <th class="sticky-right-col">GRAND</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="sticky-col team-name-cell" style="color:#ef4444;">🔴 ZELLIJ</td>
                                        ${rowACellsHtml}
                                        <td class="sec-total-cell" style="color:#10b981;">${secTotalA}</td>
                                        <td class="sticky-right-col grand-total-cell" style="color:#f87171;">${computedGrandTotals.teamA}</td>
                                    </tr>
                                    <tr>
                                        <td class="sticky-col team-name-cell" style="color:#3b82f6;">🔵 IZNIK</td>
                                        ${rowBCellsHtml}
                                        <td class="sec-total-cell" style="color:#10b981;">${secTotalB}</td>
                                        <td class="sticky-right-col grand-total-cell" style="color:#60a5fa;">${computedGrandTotals.teamB}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            };

            container.innerHTML = renderMainBoxTable("ARTS FESTIVAL (Stage & Off-Stage - All Categories)", artsPrograms) +
                                  renderMainBoxTable("SPORTS FESTIVAL (All Categories)", sportsPrograms);
        }
    </script>
</body>
</html>
