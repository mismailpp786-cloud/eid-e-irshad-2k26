<!DOCTYPE html>
<html lang="ml" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Master Scoreboard — EID-E IRSHAD 2K26</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .live-status-bar {
            background: #131c31;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 0.7rem;
        }
        .live-pulse-dot {
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: pulseLive 1.5s infinite;
        }
        @keyframes pulseLive {
            0% { transform: scale(0.95); opacity: 1; }
            70% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .tv-mode-btn {
            background: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            cursor: pointer;
        }

        /* Grand Total Score Banner */
        .broadcast-score-banner {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 6px;
            align-items: center;
            background: var(--card-bg);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 6px;
        }
        .team-score-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            border-radius: 4px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
        }
        .team-score-box.zellij-box { border-left: 4px solid #ef4444; }
        .team-score-box.iznik-box { border-left: 4px solid #3b82f6; }
        .team-badge-title { font-family: 'Montserrat', sans-serif; font-size: 0.75rem; font-weight: 900; }
        .team-giant-pts { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; font-weight: 900; color: var(--accent-gold); }
        .vs-circle {
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--accent-gold); color: #0f172a;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.55rem;
            display: flex; align-items: center; justify-content: center;
        }

        /* Matrix Section Card */
        .matrix-section-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 6px;
            margin-bottom: 6px;
        }
        .matrix-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
            padding-bottom: 2px;
            border-bottom: 1px solid var(--border-color);
        }
        .matrix-section-title {
            font-size: 0.72rem;
            font-weight: 900;
            margin: 0;
            font-family: 'Montserrat', 'Anek Malayalam', sans-serif;
            color: var(--accent-gold);
        }
        .section-sub-score {
            display: flex;
            gap: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 900;
        }

        /* Table Layout */
        .matrix-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
        }
        .score-matrix-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            background: var(--card-bg);
            font-size: 0.55rem;
        }
        .score-matrix-table th,
        .score-matrix-table td {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            vertical-align: middle;
        }
        .score-matrix-table th.sticky-col,
        .score-matrix-table td.sticky-col {
            position: sticky;
            left: 0;
            z-index: 5;
            background: var(--card-bg);
            border-right: 2px solid var(--accent-gold);
            width: 62px;
            min-width: 62px;
        }
        .score-matrix-table th.sticky-col {
            z-index: 6;
            background: var(--bg-color);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 0.48rem;
            padding: 2px;
        }
        .score-matrix-table th.cat-group-banner {
            background: rgba(245, 158, 11, 0.18);
            color: var(--accent-gold);
            font-family: 'Montserrat', 'Anek Malayalam', sans-serif;
            font-weight: 900;
            font-size: 0.55rem;
            padding: 2px;
            text-align: center;
            height: 18px;
        }
        .score-matrix-table th.prog-vert-header {
            height: 58px;
            padding: 2px 1px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 0.5rem;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            background: var(--bg-color);
            color: var(--text-color);
        }
        .group-tag-dot {
            display: inline-block; width: 3px; height: 3px; background: #f59e0b; border-radius: 50%; margin-top: 1px;
        }
        .score-matrix-table th.sec-total-header,
        .score-matrix-table th.sticky-right-col {
            height: 58px;
            width: 30px;
            min-width: 30px;
            padding: 2px 1px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 0.52rem;
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
        }
        .score-matrix-table th.sec-total-header { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        
        .score-matrix-table th.sticky-right-col,
        .score-matrix-table td.sticky-right-col {
            position: sticky;
            right: 0;
            z-index: 5;
            background: #0f172a;
            color: #fbbf24;
            border-left: 2px solid var(--accent-gold);
            width: 34px;
            min-width: 34px;
        }
        .score-matrix-table th.sticky-right-col { z-index: 6; }

        .score-matrix-table td.team-name-cell {
            font-weight: 900;
            font-size: 0.55rem;
            padding: 2px 3px;
            font-family: 'Montserrat', sans-serif;
            text-align: left;
            white-space: nowrap;
        }
        .score-matrix-table td.score-stack-cell {
            padding: 1px;
            min-height: 26px;
            height: 26px;
            vertical-align: middle;
        }
        .score-matrix-table td.score-stack-cell.admin-clickable { cursor: pointer; }
        .score-matrix-table td.score-stack-cell.admin-clickable:hover { background: rgba(245, 158, 11, 0.15); }

        .score-pill-stack {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
        }
        .stacked-score-badge {
            display: inline-block; min-width: 14px; padding: 1px 2px; border-radius: 2px;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.5rem;
        }
        .badge-team-a { background: #ef4444; color: #ffffff; }
        .badge-team-b { background: #3b82f6; color: #ffffff; }
        .empty-dash { color: var(--text-muted); opacity: 0.35; font-size: 0.5rem; }

        .score-matrix-table td.sec-total-cell {
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.6rem; padding: 1px; background: rgba(16, 185, 129, 0.06);
        }
        .score-matrix-table td.grand-total-cell {
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.65rem; padding: 1px; background: #0f172a;
        }
    </style>
</head>
<body>

    <div id="adminBar" class="admin-bar">
        <span>⚙️ Admin Mode Active</span>
        <div class="admin-actions">
            <button class="btn-backup" onclick="exportBackupJSON()">📥 Backup</button>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
        </div>
    </div>

    <div class="top-nav-bar">
        <button class="back-home-btn" onclick="location.href='index.html'">⬅️ Back</button>
        <span class="nav-page-title">📊 LIVE MASTER SCOREBOARD</span>
        <div style="display:flex; gap:8px;">
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ Light</button>
            <button class="admin-top-btn" onclick="openAdminLoginModal()" id="adminLoginBtn">🔐 Admin</button>
        </div>
    </div>

    <div class="container" style="max-width: 1250px; margin: 6px auto; padding: 0 10px;">
        
        <!-- Live Status Bar with TV Fullscreen Button -->
        <div class="live-status-bar">
            <div>
                <span class="live-pulse-dot"></span>
                <span style="font-weight: 800;">LIVE SCOREBOARD • EID-E IRSHAD 2K26</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <button class="tv-mode-btn" style="background:#334155; color:#fff;" onclick="location.href='index.html'">🏠 Home</button>
                <span id="autoRefreshTimerText" style="font-size: 0.6rem; font-weight: 800; font-family: 'Montserrat', sans-serif;">🔄 30s</span>
                <button class="tv-mode-btn" onclick="toggleTrueFullscreen()" id="tvFullscreenBtn">📺 TV Fullscreen</button>
            </div>
        </div>

        <!-- Grand Total Score Banner -->
        <div class="broadcast-score-banner">
            <div class="team-score-box zellij-box">
                <div>
                    <div class="team-badge-title" style="color: #f87171;">🔴 ZELLIJ</div>
                    <div style="font-size: 0.55rem; font-weight: 700; color: var(--text-muted);" id="medalsA">🥇0 🥈0 🥉0</div>
                </div>
                <div class="team-giant-pts" id="bigPtsA">0</div>
            </div>

            <div class="vs-circle">VS</div>

            <div class="team-score-box iznik-box">
                <div>
                    <div class="team-badge-title" style="color: #60a5fa;">🔵 IZNIK</div>
                    <div style="font-size: 0.55rem; font-weight: 700; color: var(--text-muted);" id="medalsB">🥇0 🥈0 🥉0</div>
                </div>
                <div class="team-giant-pts" id="bigPtsB">0</div>
            </div>
        </div>

        <!-- Admin Quick Controls -->
        <div class="card admin-only" data-display="block" style="border: 1px solid var(--accent-gold); margin-bottom: 4px; padding: 4px; border-radius: 6px; background: var(--card-bg);">
            <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.7rem;">
                <select id="pointPresetSelect" class="form-control" style="max-width: 220px; padding: 2px;" onchange="changePointPreset(this.value)">
                    <option value="5-3-1">Rules (Single: 5,3,1 | Group: 10,6,3)</option>
                    <option value="10-5-3">Custom (All: 10,5,3)</option>
                </select>
                <label style="font-weight: 700; display:flex; align-items:center; gap:3px;"><input type="checkbox" id="manualScoreToggle"> Override</label>
                <input type="number" id="manualPtsAInput" class="form-control" style="width: 55px; padding: 2px;" value="0">
                <input type="number" id="manualPtsBInput" class="form-control" style="width: 55px; padding: 2px;" value="0">
                <button class="btn-submit" style="background: #059669; color: #fff; margin: 0; width: auto; padding: 2px 8px;" onclick="saveManualScoreFromUI()">Save</button>
            </div>
        </div>

        <!-- Master Score Matrix Container -->
        <div id="masterScoreMatrixContainer"></div>

    </div>

    <!-- Modal for Admin Cell Score Editing -->
    <div id="cellScoreModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCellScoreModal()">&times;</span>
            <h3 id="cellModalTitle" style="margin: 0 0 10px; font-weight: 900; color: var(--accent-gold);">Edit Marks</h3>
            <input type="hidden" id="editCellKey">
            <div class="form-group">
                <label style="color: var(--zellij-red);">🔴 Team ZELLIJ Marks:</label>
                <input type="text" id="editCellTeamA" class="form-control" placeholder="5, 1">
            </div>
            <div class="form-group">
                <label style="color: var(--iznik-blue);">🔵 Team IZNIK Marks:</label>
                <input type="text" id="editCellTeamB" class="form-control" placeholder="3">
            </div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button class="btn-submit" style="background: #059669; color: #fff; margin: 0; padding: 6px;" onclick="saveCellScoreModal()">Save</button>
                <button class="btn-submit" style="background: #dc2626; color: #fff; margin: 0; padding: 6px;" onclick="clearCellScoreModal()">Reset</button>
            </div>
        </div>
    </div>

    <footer style="margin-top: 15px;">
        &copy; 2026 EID-E IRSHAD &bull; IRSHADUNNASIHEEN SAHITHYA SAMAJAM
    </footer>

    <script src="app.js"></script>
    <script>
        let refreshCountdown = 30;
        setInterval(() => {
            refreshCountdown--;
            if (refreshCountdown <= 0) {
                refreshCountdown = 30;
                refreshAllPageViews();
            }
            const timerEl = document.getElementById("autoRefreshTimerText");
            if (timerEl) timerEl.textContent = `🔄 ${refreshCountdown}s`;
        }, 1000);

        function toggleTrueFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert("Fullscreen error: " + err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById("tvFullscreenBtn");
            if (btn) {
                btn.textContent = document.fullscreenElement ? "❌ Exit Fullscreen" : "📺 TV Fullscreen";
            }
        });

        function renderMasterScoreMatrix() {
            const container = document.getElementById("masterScoreMatrixContainer");
            if (!container) return;

            const progs = normalizeProgramsData(appData.programs);
            
            let onStageGroups = [];
            let offStageGroups = [];
            let sportsGroups = [];

            const categoriesOrder = [
                { key: "senior", label: "SENIOR" },
                { key: "junior", label: "JUNIOR" },
                { key: "subjunior", label: "SUB JUNIOR" },
                { key: "general", label: "GENERAL" }
            ];

            categoriesOrder.forEach(cat => {
                const cObj = progs[cat.key] || { onStage: [], offStage: [], sports: [] };
                
                if ((cObj.onStage || []).length > 0) {
                    onStageGroups.push({ catLabel: cat.label, programs: cObj.onStage, catKey: cat.key });
                }
                if ((cObj.offStage || []).length > 0) {
                    offStageGroups.push({ catLabel: cat.label, programs: cObj.offStage, catKey: cat.key });
                }
                if ((cObj.sports || []).length > 0) {
                    sportsGroups.push({ catLabel: cat.label, programs: cObj.sports, catKey: cat.key });
                }
            });

            const renderGroupedBoxTable = (boxTitle, groupsData) => {
                if (groupsData.length === 0) return "";

                let secTotalA = 0;
                let secTotalB = 0;
                let catBannersHtml = `<th class="sticky-col">TEAMS</th>`;
                let headerColsHtml = "";
                let rowACellsHtml = "";
                let rowBCellsHtml = "";

                groupsData.forEach(grp => {
                    catBannersHtml += `<th colspan="${grp.programs.length}" class="cat-group-banner">${grp.catLabel}</th>`;
                    
                    grp.programs.forEach(pName => {
                        const isGrp = GROUP_EVENTS_LIST.includes(String(pName).toUpperCase());
                        const cellData = getProgramScoresForCell(grp.catKey, pName);
                        const sumA = cellData.teamA.reduce((a, b) => a + b, 0);
                        const sumB = cellData.teamB.reduce((a, b) => a + b, 0);
                        secTotalA += sumA;
                        secTotalB += sumB;

                        const stackAHtml = cellData.teamA.length > 0
                            ? `<div class="score-pill-stack">${cellData.teamA.map(n => `<span class="stacked-score-badge badge-team-a">${n}</span>`).join("")}</div>`
                            : `<span class="empty-dash">·</span>`;

                        const stackBHtml = cellData.teamB.length > 0
                            ? `<div class="score-pill-stack">${cellData.teamB.map(n => `<span class="stacked-score-badge badge-team-b">${n}</span>`).join("")}</div>`
                            : `<span class="empty-dash">·</span>`;

                        const safeCat = grp.catKey.replace(/'/g, "\\'");
                        const safeProg = pName.replace(/'/g, "\\'");
                        const clickAttr = isAdmin ? `onclick="openCellScoreModal('${safeCat}', '${safeProg}')"` : "";
                        const clickClass = isAdmin ? "admin-clickable" : "";

                        headerColsHtml += `<th class="prog-vert-header" title="${pName}">${pName}${isGrp ? ' <span class="group-tag-dot" title="Group"></span>' : ''}</th>`;
                        rowACellsHtml += `<td class="score-stack-cell ${clickClass}" ${clickAttr}>${stackAHtml}</td>`;
                        rowBCellsHtml += `<td class="score-stack-cell ${clickClass}" ${clickAttr}>${stackBHtml}</td>`;
                    });
                });

                catBannersHtml += `<th class="sec-total-header">TOTAL</th><th class="sticky-right-col">GRAND</th>`;

                return `
                    <div class="matrix-section-card">
                        <div class="matrix-section-header">
                            <h3 class="matrix-section-title">✨ ${boxTitle}</h3>
                            <div class="section-sub-score">
                                <span style="color:#ef4444;">🔴 ZELLIJ: ${secTotalA}</span>
                                <span style="color:#3b82f6;">🔵 IZNIK: ${secTotalB}</span>
                            </div>
                        </div>
                        <div class="matrix-scroll-wrapper">
                            <table class="score-matrix-table">
                                <thead>
                                    <tr>
                                        ${catBannersHtml}
                                    </tr>
                                    <tr>
                                        <th class="sticky-col">PROGRAMS</th>
                                        ${headerColsHtml}
                                        <th class="sec-total-header">--</th>
                                        <th class="sticky-right-col">--</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="sticky-col team-name-cell" style="color:#ef4444;">🔴 ZELLIJ</td>
                                        ${rowACellsHtml}
                                        <td class="sec-total-cell" style="color:#10b981;">${secTotalA}</td>
                                        <td class="sticky-right-col grand-total-cell" style="color:#f87171;">${computedGrandTotals.teamA}</td>
                                    </tr>
                                    <tr>
                                        <td class="sticky-col team-name-cell" style="color:#3b82f6;">🔵 IZNIK</td>
                                        ${rowBCellsHtml}
                                        <td class="sec-total-cell" style="color:#10b981;">${secTotalB}</td>
                                        <td class="sticky-right-col grand-total-cell" style="color:#60a5fa;">${computedGrandTotals.teamB}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            };

            const htmlContent = renderGroupedBoxTable("ON-STAGE EVENTS (സ്റ്റേജ് മത്സരങ്ങൾ)", onStageGroups) +
                                renderGroupedBoxTable("OFF-STAGE EVENTS (ഓഫ്-സ്റ്റേജ് മത്സരങ്ങൾ)", offStageGroups) +
                                renderGroupedBoxTable("SPORTS EVENTS (സ്പോർട്സ് മത്സരങ്ങൾ)", sportsGroups);

            container.innerHTML = htmlContent || `<div style="text-align:center; padding:20px; background:var(--card-bg); border-radius:8px; border:1px solid var(--border-color); color:var(--text-muted);">മത്സരങ്ങളൊന്നും ചേർത്തിട്ടില്ല.</div>`;
        }
    </script>
</body>
</html>
