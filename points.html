<!DOCTYPE html>
<html lang="ml" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Master Scoreboard — EID-E IRSHAD 2K26</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        .live-status-bar {
            background: #131c31;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .live-dot-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 0.82rem;
        }
        .live-pulse-dot {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulseLive 1.5s infinite;
        }
        @keyframes pulseLive {
            0% { transform: scale(0.95); opacity: 1; }
            70% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .tv-mode-btn {
            background: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* Simple Compact Score Banner */
        .broadcast-score-banner {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px;
            align-items: center;
            background: var(--card-bg);
            color: var(--text-color);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
            box-shadow: var(--shadow-md);
        }
        .team-score-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            border-radius: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
        }
        .team-score-box.zellij-box { border-left: 5px solid #ef4444; }
        .team-score-box.iznik-box { border-left: 5px solid #3b82f6; }
        .team-badge-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
        }
        .team-giant-pts {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-gold);
        }
        .vs-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-gold);
            color: #0f172a;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Compact Matrix Section Card */
        .matrix-section-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-md);
        }
        .matrix-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .matrix-section-title {
            font-size: 0.92rem;
            font-weight: 900;
            margin: 0;
            font-family: 'Montserrat', 'Anek Malayalam', sans-serif;
        }
        .section-sub-score {
            display: flex;
            gap: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 900;
        }
        .sub-pill-a { color: #ef4444; }
        .sub-pill-b { color: #3b82f6; }

        /* Compact Table Layout for TV Fullscreen Fit */
        .matrix-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .score-matrix-table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            min-width: 100%;
            background: var(--card-bg);
            font-size: 0.78rem;
        }
        .score-matrix-table th,
        .score-matrix-table td {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            vertical-align: middle;
        }
        .score-matrix-table th.sticky-col,
        .score-matrix-table td.sticky-col {
            position: sticky;
            left: 0;
            z-index: 5;
            background: var(--card-bg);
            border-right: 2px solid var(--accent-gold);
            min-width: 90px;
            max-width: 105px;
        }
        .score-matrix-table th.sticky-col {
            z-index: 6;
            background: var(--bg-color);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 0.7rem;
            padding: 6px 4px;
        }
        /* Reduced Font Size & Height for Program Headers so all fit on TV screen */
        .score-matrix-table th.prog-vert-header {
            height: 110px;
            min-width: 36px;
            max-width: 44px;
            padding: 6px 2px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.1;
            white-space: nowrap;
            background: var(--bg-color);
            color: var(--text-color);
        }
        .group-tag-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: #f59e0b;
            border-radius: 50%;
            margin-top: 3px;
        }
        .score-matrix-table th.sec-total-header,
        .score-matrix-table th.cat-total-header,
        .score-matrix-table th.sticky-right-col {
            height: 110px;
            min-width: 48px;
            padding: 6px 4px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 0.75rem;
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
        }
        .score-matrix-table th.sec-total-header { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .score-matrix-table th.cat-total-header { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); }
        
        .score-matrix-table th.sticky-right-col,
        .score-matrix-table td.sticky-right-col {
            position: sticky;
            right: 0;
            z-index: 5;
            background: #0f172a;
            color: #fbbf24;
            border-left: 2px solid var(--accent-gold);
        }
        .score-matrix-table th.sticky-right-col { z-index: 6; }

        .score-matrix-table td.team-name-cell {
            font-weight: 900;
            font-size: 0.78rem;
            padding: 8px 6px;
            font-family: 'Montserrat', sans-serif;
            text-align: left;
            white-space: nowrap;
        }
        .score-matrix-table td.score-stack-cell {
            padding: 4px 2px;
            min-height: 52px;
            height: 52px;
            vertical-align: middle;
        }
        .score-matrix-table td.score-stack-cell.admin-clickable { cursor: pointer; }
        .score-matrix-table td.score-stack-cell.admin-clickable:hover { background: rgba(245, 158, 11, 0.15); }

        .score-pill-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .stacked-score-badge {
            display: inline-block;
            min-width: 22px;
            padding: 1px 4px;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 0.72rem;
        }
        .badge-team-a { background: #ef4444; color: #ffffff; }
        .badge-team-b { background: #3b82f6; color: #ffffff; }
        .empty-dash { color: var(--text-muted); opacity: 0.3; font-size: 0.65rem; }

        .score-matrix-table td.sec-total-cell {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            padding: 6px 4px;
            background: rgba(16, 185, 129, 0.06);
        }
        .score-matrix-table td.cat-total-cell {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            padding: 6px 4px;
            background: rgba(245, 158, 11, 0.1);
        }
        .score-matrix-table td.grand-total-cell {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            padding: 6px 4px;
            background: #0f172a;
        }

        /* Category Filter Bar */
        .category-filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 14px;
        }
        .cat-jump-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-weight: 800;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'Montserrat', 'Anek Malayalam', sans-serif;
        }
        .cat-jump-btn.active,
        .cat-jump-btn:hover {
            border-color: var(--accent-gold);
            background: var(--accent-gold);
            color: #0f172a;
        }

        /* TV Fullscreen Mode Optimized for PC Screen */
        body.tv-live-mode .top-nav-bar,
        body.tv-live-mode footer,
        body.tv-live-mode .admin-only,
        body.tv-live-mode .category-filter-bar {
            display: none !important;
        }
        body.tv-live-mode .container {
            max-width: 99vw !important;
            margin: 6px auto !important;
        }
        body.tv-live-mode .matrix-section-card {
            padding: 8px;
            margin-bottom: 10px;
        }
        body.tv-live-mode .score-matrix-table th.prog-vert-header,
        body.tv-live-mode .score-matrix-table th.sec-total-header,
        body.tv-live-mode .score-matrix-table th.cat-total-header,
        body.tv-live-mode .score-matrix-table th.sticky-right-col {
            height: 95px;
        }
    </style>
</head>
<body>

    <div id="adminBar" class="admin-bar">
        <span>⚙️ Admin Mode Active</span>
        <div class="admin-actions">
            <button class="btn-backup" onclick="exportBackupJSON()">📥 Backup</button>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
        </div>
    </div>

    <div class="top-nav-bar">
        <button class="back-home-btn" onclick="location.href='index.html'">⬅️ Back</button>
        <span class="nav-page-title">📊 SIMPLE LIVE SCOREBOARD</span>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ Light</button>
    </div>

    <div class="container" style="max-width: 1200px; margin: 14px auto;">
        
        <!-- Live Status Bar -->
        <div class="live-status-bar">
            <div class="live-dot-wrap">
                <span class="live-pulse-dot"></span>
                <span>LIVE SCOREBOARD • EID-E IRSHAD 2K26</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="autoRefreshTimerText" style="font-size: 0.75rem; font-weight: 800; font-family: 'Montserrat', sans-serif;">🔄 30s</span>
                <button class="tv-mode-btn" onclick="toggleTvFullscreenMode()" id="tvModeBtn">📺 Fullscreen TV Mode</button>
            </div>
        </div>

        <!-- Simple Compact Grand Total Score Banner -->
        <div class="broadcast-score-banner">
            <div class="team-score-box zellij-box">
                <div>
                    <div class="team-badge-title" style="color: #f87171;">🔴 ZELLIJ</div>
                    <div style="font-size: 0.7rem; font-weight: 700; color: var(--text-muted);" id="medalsA">🥇0 🥈0 🥉0</div>
                </div>
                <div class="team-giant-pts" id="bigPtsA">0</div>
            </div>

            <div class="vs-circle">VS</div>

            <div class="team-score-box iznik-box">
                <div>
                    <div class="team-badge-title" style="color: #60a5fa;">🔵 IZNIK</div>
                    <div style="font-size: 0.7rem; font-weight: 700; color: var(--text-muted);" id="medalsB">🥇0 🥈0 🥉0</div>
                </div>
                <div class="team-giant-pts" id="bigPtsB">0</div>
            </div>
        </div>

        <!-- Admin Controls -->
        <div class="card admin-only" data-display="block" style="border: 1px solid var(--accent-gold); margin-bottom: 14px; padding: 12px;">
            <h4 style="margin: 0 0 8px 0; color: var(--accent-gold);">⚙️ Admin Quick Settings</h4>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <select id="pointPresetSelect" class="form-control" style="max-width: 280px; padding: 6px;" onchange="changePointPreset(this.value)">
                    <option value="5-3-1">Official Rules (Single: 5,3,1 | Group: 10,6,3)</option>
                    <option value="10-5-3">Custom 10-5-3 (All: 10,5,3)</option>
                </select>
                <label style="display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700;">
                    <input type="checkbox" id="manualScoreToggle"> Override Total
                </label>
                <input type="number" id="manualPtsAInput" class="form-control" style="width: 80px; padding: 6px;" value="0">
                <input type="number" id="manualPtsBInput" class="form-control" style="width: 80px; padding: 6px;" value="0">
                <button class="btn-submit" style="background: #059669; color: #fff; margin: 0; width: auto; padding: 6px 14px; font-size: 0.78rem;" onclick="saveManualScoreFromUI()">Save</button>
            </div>
        </div>

        <!-- Category Filter Bar -->
        <div class="category-filter-bar">
            <button class="cat-jump-btn active" onclick="filterMatrixView('all', this)">🌐 All</button>
            <button class="cat-jump-btn" onclick="filterMatrixView('senior', this)">🎓 Senior</button>
            <button class="cat-jump-btn" onclick="filterMatrixView('junior', this)">📘 Junior</button>
            <button class="cat-jump-btn" onclick="filterMatrixView('subjunior', this)">🌱 Sub Junior</button>
            <button class="cat-jump-btn" onclick="filterMatrixView('general', this)">🌟 General</button>
        </div>

        <!-- Master Score Matrix Container -->
        <div id="masterScoreMatrixContainer"></div>

    </div>

    <!-- Modal for Admin Direct Cell Score Editing -->
    <div id="cellScoreModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCellScoreModal()">&times;</span>
            <h3 id="cellModalTitle" style="margin: 0 0 6px; font-weight: 900; color: var(--accent-gold);">Edit Marks</h3>
            <input type="hidden" id="editCellKey">
            <div class="form-group">
                <label style="color: var(--zellij-red);">🔴 Team A Marks:</label>
                <input type="text" id="editCellTeamA" class="form-control" placeholder="5, 1">
            </div>
            <div class="form-group">
                <label style="color: var(--iznik-blue);">🔵 Team B Marks:</label>
                <input type="text" id="editCellTeamB" class="form-control" placeholder="3">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 12px;">
                <button class="btn-submit" style="background: #059669; color: #fff; margin: 0; padding: 8px;" onclick="saveCellScoreModal()">Save</button>
                <button class="btn-submit" style="background: #dc2626; color: #fff; margin: 0; padding: 8px;" onclick="clearCellScoreModal()">Reset</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 EID-E IRSHAD &bull; IRSHADUNNASIHEEN SAHITHYA SAMAJAM
    </footer>

    <script src="app.js"></script>
</body>
</html>
