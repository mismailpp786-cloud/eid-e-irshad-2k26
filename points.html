<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ലൈവ് പോയിന്റ് സ്കോർബോർഡ് — EID-E IRSHAD 2K26</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #0f172a; color: #fff;">

    <div class="subpage-header" style="background: #020617;">
        <button class="back-home-btn" onclick="location.href='index.html'">⬅️ ഹോം പേജിലേക്ക്</button>
        <h2>📊 EID-E IRSHAD 2K26 — LIVE SCOREBOARD</h2>
        <div style="font-size: 0.85rem; color: #fbbf24; font-weight: 700;">⚡ ഓട്ടോമാറ്റിക് അപ്ഡേറ്റ് സജീവമാണ്</div>
    </div>

    <main class="container" style="max-width: 1100px;">
        <!-- OVERALL TOTAL SCORE CARDS -->
        <div class="live-score-grid">
            <div class="live-team-card team-a-box">
                <h3 id="labelTeamA">TEAM A</h3>
                <div class="live-score-num" id="totalPointsA">0</div>
                <p>Total Points</p>
            </div>
            <div class="live-vs">VS</div>
            <div class="live-team-card team-b-box">
                <h3 id="labelTeamB">TEAM B</h3>
                <div class="live-score-num" id="totalPointsB">0</div>
                <p>Total Points</p>
            </div>
        </div>

        <!-- CATEGORY WISE BREAKDOWN -->
        <div class="card" style="background: #1e293b; border: 1px solid #334155; margin-top: 30px;">
            <div class="card-header" style="background: #020617; color: #fbbf24;">
                <h3>🏆 കാറ്റഗറി തിരിച്ചുള്ള പോയിന്റ് നില (Category Wise Points)</h3>
            </div>
            <div style="padding: 20px;" id="categoryBreakdownContainer">
                <!-- Dynamic Breakdown Table/Grids will load here -->
            </div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
    <script>
        // Auto refresh / reload data every 10 seconds for the screen display
        setInterval(() => {
            if (typeof loadAppData === "function") {
                loadAppData();
            }
        }, 10000);
    </script>
</body>
</html>
