<!DOCTYPE html>
<html lang="ml" data-theme="light">
<head>
    <meta charset="UTF-8">

    <title>Results & Posters — EID-E IRSHAD 2K26</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
        }
        [data-theme="dark"] {
            --bg-color: #090d16; --card-bg: #131c31; --text-color: #f1f5f9; --text-muted: #94a3b8; --border-color: #1e293b;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Anek Malayalam', 'Montserrat', sans-serif; margin: 0; padding: 0; }
        .top-nav-bar { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .back-home-btn { background: #fbbf24; color: #0f172a; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; cursor: pointer; font-family: 'Montserrat', sans-serif; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; box-sizing: border-box; }
        .page-title { text-align: center; font-weight: 900; font-size: 1.8rem; margin-bottom: 20px; color: #f59e0b; }
        footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.85rem; margin-top: 30px; border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="top-nav-bar">
        <button class="back-home-btn" onclick="location.href='index.html'">⬅️ Back to Home</button>
        <span style="font-weight: 800; font-size: 0.9rem;">🏆 RESULTS & POSTERS</span>
    </div>
    <div class="container">
        <h1 class="page-title">Competition Results</h1>
        <p style="text-align: center; color: var(--text-muted);">മത്സര ഫലങ്ങളും പോസ്റ്ററുകളും ഇവിടെ ലഭ്യമാകും.</p>
    </div>
