<!DOCTYPE html>
<html lang="ml" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results Studio & Poster Generator — EID-E IRSHAD 2K26</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        .result-form-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-md);
        }
        .result-item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .winner-badge {
            font-size: 0.85rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div id="adminBar" class="admin-bar">
        <span>⚙️ Admin Mode Active</span>
        <div class="admin-actions">
            <button class="btn-backup" onclick="exportBackupJSON()">📥 Backup</button>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
        </div>
    </div>

    <div class="top-nav-bar" style="display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:var(--card-bg); border-bottom:1px solid var(--border-color);">
        <button class="back-home-btn" onclick="location.href='index.html'" style="background:var(--accent-gold); color:#0f172a; border:none; padding:8px 14px; border-radius:6px; font-weight:900; cursor:pointer;">⬅️ Home</button>
        <span class="nav-page-title" style="font-family:'Montserrat',sans-serif; font-weight:900; font-size:1.1rem;">🏆 RESULTS STUDIO & POSTER</span>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">🌙 Dark</button>
    </div>

    <div class="container" style="max-width: 1000px; margin: 30px auto;">
        
        <div class="admin-only result-form-card" data-display="block">
            <h3 style="margin:0 0 12px; font-weight:900; color:var(--accent-gold);">📝 പുതിയ മത്സര ഫലം പ്രഖ്യാപിക്കുക</h3>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 15px;">
                <div class="form-group">
                    <label>മത്സരത്തിന്റെ പേര് (Program):</label>
                    <input type="text" id="resProgramInput" class="form-control" placeholder="ഉദാ: മാപ്പിളപ്പാട്ട്">
                </div>
                <div class="form-group">
                    <label>വിഭാഗം (Category):</label>
                    <select id="resCategoryInput" class="form-control">
                        <option value="Senior">Senior</option>
                        <option value="Junior">Junior</option>
                        <option value="Sub Junior">Sub Junior</option>
                        <option value="General">General</option>
                    </select>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px;">
                <div style="background:rgba(251,191,36,0.08); padding:12px; border-radius:10px; border:1px solid var(--accent-gold);">
                    <label style="font-weight:900; font-size:0.82rem; color:var(--accent-gold);">🥇 ഒന്നാം സ്ഥാനം (1st Place):</label>
                    <input type="text" id="resWin1Name" class="form-control" placeholder="വിദ്യാർത്ഥിയുടെ പേര്" style="margin-top:6px; margin-bottom:8px;">
                    <select id="resWin1Team" class="form-control">
                        <option value="teamA">🔴 Team ZELLIJ</option>
                        <option value="teamB">🔵 Team IZNIK</option>
                    </select>
                </div>
                <div style="background:rgba(148,163,184,0.08); padding:12px; border-radius:10px; border:1px solid var(--border-color);">
                    <label style="font-weight:900; font-size:0.82rem;">🥈 രണ്ടാം സ്ഥാനം (2nd Place):</label>
                    <input type="text" id="resWin2Name" class="form-control" placeholder="വിദ്യാർത്ഥിയുടെ പേര്" style="margin-top:6px; margin-bottom:8px;">
                    <select id="resWin2Team" class="form-control">
                        <option value="teamA">🔴 Team ZELLIJ</option>
                        <option value="teamB">🔵 Team IZNIK</option>
                    </select>
                </div>
                <div style="background:rgba(217,119,6,0.08); padding:12px; border-radius:10px; border:1px solid #d97706;">
                    <label style="font-weight:900; font-size:0.82rem; color:#d97706;">🥉 മൂന്നാം സ്ഥാനം (3rd Place):</label>
                    <input type="text" id="resWin3Name" class="form-control" placeholder="വിദ്യാർത്ഥിയുടെ പേര്" style="margin-top:6px; margin-bottom:8px;">
                    <select id="resWin3Team" class="form-control">
                        <option value="teamA">🔴 Team ZELLIJ</option>
                        <option value="teamB">🔵 Team IZNIK</option>
                    </select>
                </div>
            </div>

            <button class="btn-submit" onclick="publishNewResult()">Publish Result</button>
        </div>

        <div class="section-heading">📢 പ്രഖ്യാപിച്ച ഫലങ്ങളുടെ ലിസ്റ്റ്</div>
        <div id="resultsListContainer">
            <p style="color:var(--text-muted);">ഫലങ്ങൾ ലോഡ് ചെയ്യുന്നു...</p>
        </div>

    </div>

    <footer>&copy; 2026 EID-E IRSHAD &bull; IRSHADUNNASIHEEN SAHITHYA SAMAJAM</footer>
    <script src="app.js"></script>
    <script>
        function updateUIOnDataLoad() {
            renderResultsStudioList();
        }

        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => { renderResultsStudioList(); }, 300);
        });

        function publishNewResult() {
            if (!isAdmin) { alert("അഡ്മിൻ അനുമതി ആവശ്യമാണ്!"); return; }
            
            const program = document.getElementById("resProgramInput")?.value.trim();
            const category = document.getElementById("resCategoryInput")?.value;
            const webWin1Name = document.getElementById("resWin1Name")?.value.trim();
            const team1 = document.getElementById("resWin1Team")?.value;
            const win2Name = document.getElementById("resWin2Name")?.value.trim();
            const team2 = document.getElementById("resWin2Team")?.value;
            const win3Name = document.getElementById("resWin3Name")?.value.trim();
            const team3 = document.getElementById("resWin3Team")?.value;

            if (!program || !webWin1Name) {
                alert("മത്സരത്തിന്റെ പേരും ഒന്നാം സ്ഥാനക്കാരന്റെ പേരും നിർബന്ധമായും നൽകുക!");
                return;
            }

            const newResult = {
                id: Date.now().toString(),
                program,
                category,
                win1Name: webWin1Name, team1,
                win2Name, team2,
                win3Name, team3,
                timestamp: new Date().toISOString()
            };

            if (!appData.results) appData.results = [];
            appData.results.push(newResult);

            saveAppData(true, null, () => {
                document.getElementById("resProgramInput").value = "";
                document.getElementById("resWin1Name").value = "";
                document.getElementById("resWin2Name").value = "";
                document.getElementById("resWin3Name").value = "";
                renderResultsStudioList();
            });
        }

        function deleteResultEntry(resultId) {
            if (!isAdmin) { alert("അഡ്മിൻ അനുമതി ആവശ്യമാണ്!"); return; }
            if (confirm("ഈ ഫലം ഒഴിവാക്കണമെന്ന് ഉറപ്പാണോ?")) {
                appData.results = (appData.results || []).filter(r => r.id !== resultId);
                saveAppData(true, null, () => {
                    renderResultsStudioList();
                });
            }
        }

        function renderResultsStudioList() {
            const container = document.getElementById("resultsListContainer");
            if (!container) return;

            const results = appData.results || [];
            if (results.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted); padding:15px; background:var(--card-bg); border-radius:12px; border:1px solid var(--border-color);">ഫലങ്ങൾ ഇതുവരെ പ്രഖ്യാപിച്ചിട്ടില്ല.</p>`;
                return;
            }

            let html = "";
            results.slice().reverse().forEach(res => {
                html += `
                    <div class="result-item-card">
                        <div>
                            <span style="font-size:0.75rem; font-weight:800; color:var(--accent-gold); font-family:'Montserrat',sans-serif;">${res.category || ""}</span>
                            <h4 style="margin:2px 0 8px; font-size:1.1rem; font-weight:900;">${res.program || ""}</h4>
                            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                                <span class="winner-badge" style="border-color:var(--accent-gold);">🥇 ${res.win1Name || "—"} (${res.team1 === 'teamA' ? 'ZELLIJ' : 'IZNIK'})</span>
                                ${res.win2Name ? `<span class="winner-badge">🥈 ${res.win2Name} (${res.team2 === 'teamA' ? 'ZELLIJ' : 'IZNIK'})</span>` : ""}
                                ${res.win3Name ? `<span class="winner-badge">🥉 ${res.win3Name} (${res.team3 === 'teamA' ? 'ZELLIJ' : 'IZNIK'})</span>` : ""}
                            </div>
                        </div>
                        <div class="admin-only" style="display:none;">
                            <button onclick="deleteResultEntry('${res.id}')" style="background:#dc2626; color:#fff; border:none; padding:6px 12px; border-radius:6px; font-weight:900; cursor:pointer;">Delete</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
