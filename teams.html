<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ടീം ലിസ്റ്റ് — EID-E IRSHAD 2K26</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TOP ADMIN BAR -->
    <div id="adminBar" class="admin-bar" style="display: none;">
        <span>⚙️ അഡ്മിൻ മോഡ് സജീവമാണ്</span>
        <div class="admin-actions">
            <button class="btn-reset" onclick="resetToDefaultData()">🔄 Reset</button>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
        </div>
    </div>

    <div class="subpage-header">
        <button class="back-home-btn" onclick="location.href='index.html'">⬅️ ഹോം പേജിലേക്ക് മടങ്ങുക</button>
        <h2>👥 ടീം ലിസ്റ്റ് (Team A & Team B)</h2>
        <button class="admin-top-btn" id="adminBtn" onclick="openAdminModal()">🔐 Admin Login</button>
    </div>

    <main class="container">
        <div class="teams-grid">
            <!-- Team A Card -->
            <div class="card">
                <div class="card-header team-a-header">
                    <h3>🔴 TEAM A</h3>
                    <button class="admin-only-btn" style="display:none;" onclick="addNewStudent('teamA')">+ ആളെ ചേർക്കുക</button>
                </div>
                <div class="team-list-body" id="teamAContainer"></div>
            </div>

            <!-- Team B Card -->
            <div class="card">
                <div class="card-header team-b-header">
                    <h3>🔵 TEAM B</h3>
                    <button class="admin-only-btn" style="display:none;" onclick="addNewStudent('teamB')">+ ആളെ ചേർക്കുക</button>
                </div>
                <div class="team-list-body" id="teamBContainer"></div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 EID-E IRSHAD — IRSHADUNNASIHEEN SAHITHYA SAMAJAM
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
