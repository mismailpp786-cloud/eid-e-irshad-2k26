<!DOCTYPE html>
<html lang="ml" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams & Members — EID-E IRSHAD 2K26</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-nav-bar">
        <button class="back-home-btn" onclick="location.href='index.html'">⬅️ Back to Home</button>
        <span class="nav-page-title">👥 FESTIVAL TEAMS & ROSTERS</span>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">🌙 Dark</button>
    </div>
    <div class="container" style="max-width: 950px; margin: 30px auto;">
        <h1 class="page-title">ടീമുകളും അംഗങ്ങളും</h1>
        <p class="page-subtitle">Team ZELLIJ, Team IZNIK എന്നിവയിലെ സീനിയർ, ജൂനിയർ, സബ് ജൂനിയർ പ്രതിഭകൾ</p>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
            <div class="card" style="border-top: 5px solid var(--zellij-red);">
                <h2 style="color: var(--zellij-red); font-family: 'Montserrat', sans-serif; margin-top: 0;">🔴 Team ZELLIJ</h2>
                <div id="zellijRosterContent"></div>
            </div>
            <div class="card" style="border-top: 5px solid var(--iznik-blue);">
                <h2 style="color: var(--iznik-blue); font-family: 'Montserrat', sans-serif; margin-top: 0;">🔵 Team IZNIK</h2>
                <div id="iznikRosterContent"></div>
            </div>
        </div>
    </div>
    <footer>&copy; 2026 EID-E IRSHAD &bull; IRSHADUNNASIHEEN SAHITHYA SAMAJAM</footer>
    <script src="app.js"></script>
    <script>
        function renderTeamsRoster() {
            if (typeof appData === 'undefined' || !appData.teams) return;
            const renderTeamBox = (teamKey, containerId) => {
                const container = document.getElementById(containerId);
                if (!container) return;
                const team = appData.teams[teamKey];
                if (!team) return;
                let html = `<p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:15px;">Short Name: <strong>${team.shortName}</strong></p>`;
                const sections = [
                    { key: 'senior', label: 'Senior Roster' },
                    { key: 'junior', label: 'Junior Roster' },
                    { key: 'subjunior', label: 'Sub Junior Roster' }
                ];
                sections.forEach(sec => {
                    const members = team[sec.key] || [];
                    if (members.length > 0) {
                        html += `<div style="margin-bottom:12px;">
                            <h4 style="margin:0 0 5px; font-size:0.9rem; color:var(--accent-gold);">${sec.label}</h4>
                            <div style="display:flex; flex-wrap:wrap; gap:6px;">`;
                        members.forEach(m => {
                            html += `<span style="background:var(--bg-color); border:1px solid var(--border-color); padding:4px 10px; border-radius:6px; font-size:0.8rem; font-weight:700;">${m}</span>`;
                        });
                        html += `</div></div>`;
                    }
                });
                container.innerHTML = html;
            };
            renderTeamBox('teamA', 'zellijRosterContent');
            renderTeamBox('teamB', 'iznikRosterContent');
        }
        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => { renderTeamsRoster(); }, 200);
        });
    </script>
</body>
</html>
