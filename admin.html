<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>അഡ്മിൻ പാനൽ — EID-E IRSHAD 2K26</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-box { background: #fff; border-radius: 12px; padding: 24px; max-width: 500px; margin: 40px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .admin-box h2 { color: #1e293b; margin-bottom: 15px; font-weight: 800; }
        .admin-box p { color: #64748b; margin-bottom: 20px; font-size: 0.95rem; }
        .btn-action { background: #2563eb; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; margin-bottom: 10px; font-size: 1rem; }
        .btn-reset-data { background: #dc2626; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; font-size: 1rem; }
        .subpage-header { background: #0f172a; color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #fbbf24; }
        .back-home-btn { background: #fbbf24; color: #0f172a; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <div class="subpage-header">
        <button class="back-home-btn" onclick="location.href='index.html'">⬅️ ഹോം പേജിലേക്ക്</button>
        <h2>⚙️ അഡ്മിൻ പാനൽ</h2>
    </div>

    <main class="container">
        <div class="admin-box">
            <h2>അഡ്മിൻ മാനേജ്മെന്റ്</h2>
            <p>മത്സര ഫലങ്ങളും പോസ്റ്ററുകളും നേരിട്ട് നിർമ്മിക്കാൻ താഴെ ക്ലിക്ക് ചെയ്യുക:</p>
            <button class="btn-action" onclick="location.href='results.html'">🎨 റിസൾട്ട് പോസ്റ്റർ മേക്കർ തുറക്കുക</button>
            <button class="btn-action" style="background: #059669;" onclick="location.href='programs.html'">📋 പ്രോഗ്രാം ലിസ്റ്റ് കാണുക</button>
            <button class="btn-reset-data" onclick="resetAllData()">🔄 ഫലങ്ങളും ഡാറ്റയും റീസെറ്റ് ചെയ്യുക</button>
        </div>
    </main>

    <footer>
        &copy; 2026 EID-E IRSHAD — IRSHADUNNASIHEEN SAHITHYA SAMAJAM
    </footer>

    <script>
        function resetAllData() {
            if (confirm("ശ്രദ്ധിക്കുക: സേവ് ചെയ്ത മുഴുവൻ മത്സര ഫലങ്ങളും മാഞ്ഞുപോകും. തുടരണോ?")) {
                localStorage.removeItem("eid_results_list");
                alert("എല്ലാ ഡാറ്റയും റീസെറ്റ് ചെയ്തിരിക്കുന്നു!");
                location.reload();
            }
        }
    </script>
</body>
</html>
